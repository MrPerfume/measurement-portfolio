name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  domain-kernel:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Verify public domain kernel
        run: bash scripts/verify.sh
